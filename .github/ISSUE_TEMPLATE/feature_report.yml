name: Feature request
description: Describe an API operation or workflow the server should support.
title: '[feature] '
body:
  - type: markdown
    attributes:
      value: Do not share client secrets, refresh tokens or tenant data. Report security vulnerabilities privately.
  - type: input
    id: environment
    attributes:
      label: Server version, client, zone and account type
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Use case and proposed behavior
      description: Include the relevant API operation and redacted tool input, where applicable.
    validations:
      required: true
