services:
  site24x7-mcp:
    build: .
    image: site24x7-code-mode-mcp:latest
    container_name: site24x7-code-mode-mcp
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: '8000'
      # In multi-tenant deployments, leave the credential vars unset and let
      # the MCP client send them as X-Site24x7-* headers per request.
      SITE24X7_CLIENT_ID: ${SITE24X7_CLIENT_ID:-}
      SITE24X7_CLIENT_SECRET: ${SITE24X7_CLIENT_SECRET:-}
      SITE24X7_REFRESH_TOKEN: ${SITE24X7_REFRESH_TOKEN:-}
      SITE24X7_ZONE: ${SITE24X7_ZONE:-com}
      SITE24X7_ZAAID: ${SITE24X7_ZAAID:-}
      SITE24X7_ACCOUNT_TYPE: ${SITE24X7_ACCOUNT_TYPE:-standard}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
